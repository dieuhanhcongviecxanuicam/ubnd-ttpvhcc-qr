name: Chế độ chống tấn công

# Bật/tắt lớp bảo vệ ở Cloudflare mà KHÔNG cần máy tính có cài đặt sẵn.
#
# Vì sao cần: khi site bị dội request, người trực có thể chỉ có điện thoại trong
# tay. Workflow này chạy được từ trình duyệt điện thoại (tab Actions > Run
# workflow), nên không phải tìm máy có Python, có token, có kho mã đã tải về.
#
# Đọc kỹ trước khi chọn "bat": chế độ này bắt MỌI người truy cập site qua trang
# xác minh vài giây, kể cả người dân đang quét mã QR tại quầy. Chỉ dùng khi thật
# sự đang bị tấn công, và tắt ngay khi hết đợt. Nó chỉ áp cho ttpvhcc.xanuicam.vn,
# không chạm tới subdomain khác của zone, và vẫn cho bot tìm kiếm đã xác minh đi
# qua. Lý do đầy đủ nằm ở đầu scripts/bao-ve-cloudflare.py.

on:
  workflow_dispatch:
    inputs:
      viec:
        description: "Việc cần làm"
        required: true
        default: kiem-tra
        type: choice
        options:
          - kiem-tra          # chỉ đọc và in trạng thái, không đổi gì
          - bat-chong-tan-cong
          - tat-chong-tan-cong
          - ap-dung-bao-ve    # dựng lại bốn lớp bảo vệ thường trực
      xac_nhan:
        description: 'Gõ "DONG Y" nếu chọn bật chống tấn công hoặc áp dụng bảo vệ'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bao-ve-cloudflare
  cancel-in-progress: false

jobs:
  chay:
    name: ${{ inputs.viec }}
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BAO_VE }}
    steps:
      - name: Báo khi chưa cấu hình token
        if: env.CF_TOKEN == ''
        run: |
          echo "::error::Chưa có secret CLOUDFLARE_API_TOKEN_BAO_VE."
          echo "Token này cần quyền rộng hơn token xoá cache, nên để RIÊNG:"
          echo "  Zone / Zone / Read"
          echo "  Zone / Zone Settings / Read và Edit"
          echo "  Zone / Zone WAF / Edit"
          echo "  Zone / Transform Rules / Edit"
          echo "Xem docs/BAO-MAT.md mục 9."
          exit 1

      # Thao tác đổi trạng thái phải gõ xác nhận. Một cú bấm nhầm trong danh sách
      # chọn sẽ dựng trang xác minh trước mặt toàn bộ người dân đang tra cứu.
      - name: Buộc xác nhận với thao tác có ảnh hưởng
        if: >-
          (inputs.viec == 'bat-chong-tan-cong' || inputs.viec == 'ap-dung-bao-ve')
          && inputs.xac_nhan != 'DONG Y'
        run: |
          echo "::error::Thao tác '${{ inputs.viec }}' cần gõ DONG Y vào ô xác nhận."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CF_TOKEN != ''

      - name: Chạy
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BAO_VE }}
        run: |
          case "${{ inputs.viec }}" in
            kiem-tra)            python3 scripts/bao-ve-cloudflare.py --kiem-tra ;;
            bat-chong-tan-cong)  python3 scripts/bao-ve-cloudflare.py --che-do-tan-cong bat ;;
            tat-chong-tan-cong)  python3 scripts/bao-ve-cloudflare.py --che-do-tan-cong tat ;;
            ap-dung-bao-ve)      python3 scripts/bao-ve-cloudflare.py --ap-dung ;;
          esac

      - name: Nhắc tắt lại sau khi hết đợt
        if: env.CF_TOKEN != '' && inputs.viec == 'bat-chong-tan-cong'
        run: |
          echo "::warning::Chế độ chống tấn công đang BẬT. Người dân phải qua trang"
          echo "::warning::xác minh. Chạy lại workflow này với 'tat-chong-tan-cong'"
          echo "::warning::ngay khi hết đợt. Bật/tắt cần 20-30 giây mới có tác dụng."
