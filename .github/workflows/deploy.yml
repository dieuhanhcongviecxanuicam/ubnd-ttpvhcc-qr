name: Triển khai GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cho phép GITHUB_TOKEN publish lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ chạy một lượt triển khai tại một thời điểm, không huỷ lượt đang chạy dở
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Tên miền riêng ttpvhcc.xanuicam.vn phục vụ ngay từ gốc nên không cần
      # NEXT_PUBLIC_BASE_PATH. Giá trị mặc định trong src/lib/site-config.ts đã đúng.
      - name: Build
        run: npm run build

      # Bỏ qua xử lý Jekyll - nếu không, GitHub Pages sẽ nuốt thư mục _next/
      - name: Thêm .nojekyll
        run: touch out/.nojekyll

      # public/CNAME được Next chép sang out/ khi build. Thiếu file này là
      # GitHub Pages gỡ cấu hình tên miền riêng ngay ở lượt triển khai kế tiếp.
      - name: Xác nhận CNAME
        run: test -f out/CNAME && cat out/CNAME

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Tự đóng gói thay vì dùng actions/upload-pages-artifact.
      #
      # Action đó chạy tar kèm `--exclude=.[^/]*`, tức LOẠI BỎ mọi mục bắt đầu
      # bằng dấu chấm ở gốc thư mục xuất bản. Hậu quả đã gặp thật:
      # `/.well-known/security.txt` trả 404 trên production dù tệp nằm đúng chỗ
      # trong out/, và chính `.nojekyll` vừa tạo ở bước trên cũng bị ném đi.
      # Build xanh, deploy xanh, không một cảnh báo nào - đúng lớp lỗi âm thầm.
      #
      # Phần còn lại giữ nguyên hợp đồng của Pages: một artifact tên
      # `github-pages` chứa `artifact.tar`, đúng thứ actions/deploy-pages chờ.
      - name: Đóng gói artifact, giữ lại cả mục bắt đầu bằng dấu chấm
        run: |
          tar --dereference --hard-dereference --directory out \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      # Hàng rào: tệp nào bắt buộc phải có mặt thì kiểm ngay trong gói sắp gửi
      # đi, chứ không đợi phát hiện bằng cách mở trang rồi thấy 404.
      - name: Đối chiếu những tệp bắt buộc có trong gói
        run: |
          thieu=0
          for tep in ./CNAME ./.nojekyll ./index.html ./.well-known/security.txt; do
            if tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qxF "$tep"; then
              echo "  có $tep"
            else
              echo "::error::Gói triển khai thiếu $tep"
              thieu=1
            fi
          done
          exit $thieu

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Triển khai
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Cloudflare cache trang HTML ở biên (xem docs/HIEU-NANG.md mục 5.2). Không xoá
  # sau khi triển khai thì bản cũ còn được phục vụ tới hết Edge TTL.
  #
  # Job này TỰ BỎ QUA khi chưa có secret CLOUDFLARE_API_TOKEN, nên thêm sẵn ở đây
  # không làm hỏng gì; nó tự chạy kể từ lúc đơn vị nạp token.
  #
  # Token chỉ nên có đúng hai quyền, KHÔNG cấp rộng hơn - job triển khai vốn đã
  # giữ pages:write, càng ít quyền cộng thêm càng tốt:
  #     Zone / Zone / Read
  #     Zone / Cache Purge / Purge
  xoa-cache:
    name: Xoá cache Cloudflare
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CF_TOKEN != ''

      # `secrets` không dùng được trong `if`, nên phải đưa qua `env` rồi mới xét.
      #
      # Gọi thẳng script thay vì viết lại bằng curl ở đây: bản đầu nhân đôi phần
      # tra zone và đã sai đúng chỗ đó - tra theo tên miền đầy đủ
      # ttpvhcc.xanuicam.vn trong khi zone của Cloudflare là tên miền gốc
      # xanuicam.vn, nên job trượt ngay lượt triển khai đầu tiên. Script chỉ dùng
      # thư viện chuẩn nên không cần cài gì thêm.
      - name: Xoá toàn bộ cache của zone
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cau-hinh-cloudflare.py --xoa-cache

      - name: Báo khi chưa cấu hình
        if: env.CF_TOKEN == ''
        run: |
          echo "Chưa có secret CLOUDFLARE_API_TOKEN nên bỏ qua bước xoá cache."
          echo "Xem docs/VAN-HANH.md mục Cloudflare."

