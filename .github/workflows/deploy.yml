name: Triển khai GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cho phép GITHUB_TOKEN publish lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ chạy một lượt triển khai tại một thời điểm, không huỷ lượt đang chạy dở
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Tên miền riêng ttpvhcc.xanuicam.vn phục vụ ngay từ gốc nên không cần
      # NEXT_PUBLIC_BASE_PATH. Giá trị mặc định trong src/lib/site-config.ts đã đúng.
      - name: Build
        run: npm run build

      # Bỏ qua xử lý Jekyll - nếu không, GitHub Pages sẽ nuốt thư mục _next/
      - name: Thêm .nojekyll
        run: touch out/.nojekyll

      # public/CNAME được Next chép sang out/ khi build. Thiếu file này là
      # GitHub Pages gỡ cấu hình tên miền riêng ngay ở lượt triển khai kế tiếp.
      - name: Xác nhận CNAME
        run: test -f out/CNAME && cat out/CNAME

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    name: Triển khai
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Cloudflare cache trang HTML ở biên (xem docs/HIEU-NANG.md mục 5.2). Không xoá
  # sau khi triển khai thì bản cũ còn được phục vụ tới hết Edge TTL.
  #
  # Job này TỰ BỎ QUA khi chưa có secret CLOUDFLARE_API_TOKEN, nên thêm sẵn ở đây
  # không làm hỏng gì; nó tự chạy kể từ lúc đơn vị nạp token.
  #
  # Token chỉ nên có đúng hai quyền, KHÔNG cấp rộng hơn - job triển khai vốn đã
  # giữ pages:write, càng ít quyền cộng thêm càng tốt:
  #     Zone / Zone / Read
  #     Zone / Cache Purge / Purge
  xoa-cache:
    name: Xoá cache Cloudflare
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.CF_TOKEN != ''

      # `secrets` không dùng được trong `if`, nên phải đưa qua `env` rồi mới xét.
      - name: Xoá toàn bộ cache của zone
        if: env.CF_TOKEN != ''
        run: |
          set -euo pipefail
          mien=$(cat public/CNAME)
          zone=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$mien" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("result") else "")')
          if [ -z "$zone" ]; then
            echo "Không tra được zone cho $mien - token sai tài khoản hoặc thiếu quyền Zone/Zone/Read"
            exit 1
          fi
          curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Đã xoá cache." if d.get("success") else "LỖI: "+json.dumps(d.get("errors"),ensure_ascii=False)); sys.exit(0 if d.get("success") else 1)'

      - name: Báo khi chưa cấu hình
        if: env.CF_TOKEN == ''
        run: |
          echo "Chưa có secret CLOUDFLARE_API_TOKEN nên bỏ qua bước xoá cache."
          echo "Xem docs/VAN-HANH.md mục Cloudflare."

