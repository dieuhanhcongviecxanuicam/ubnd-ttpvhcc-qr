name: Kiểm tra chất lượng

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kiem-tra:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Rẻ và nhanh nên đặt đầu tiên. Chặn lớp lỗi "quy trình chỉ nằm trong trí
      # nhớ": package.json từng đứng yên ở 1.0.0 suốt chín bản phát hành, y như
      # việc bảy pull request liên tiếp quên cập nhật CHANGELOG.md.
      - name: Đối chiếu phiên bản với nhật ký thay đổi
        run: npm run kiem-tra-phien-ban

      # Lighthouse chạy trên WSL sinh thư mục profile Chrome mang tên kiểu Windows
      # ngay trong thư mục dự án; một lần `git add -A` đã nuốt trọn 6.123 tệp như
      # vậy (158 MB) vào kho. Đường dẫn hợp lệ của dự án không bao giờ chứa dấu \.
      - name: Chặn đường dẫn kiểu Windows lọt vào kho
        run: |
          if git ls-files | grep -q '\\'; then
            echo "Có tệp mang đường dẫn kiểu Windows trong kho:"
            git ls-files | grep '\\' | head -20
            exit 1
          fi
          echo "Không có đường dẫn kiểu Windows nào."

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Test bất biến dữ liệu chặn lại lớp lỗi từng lọt ra production: số thủ tục
      # hiển thị trên trang lĩnh vực không khớp danh sách thực tế.
      - name: Chạy test
        run: npm test

      - name: Build thử (static export)
        run: npm run build

      # CNAME phải có mặt trong out/, nếu không GitHub Pages sẽ gỡ tên miền riêng.
      - name: Xác nhận CNAME được xuất kèm
        run: |
          test -f out/CNAME || { echo "THIẾU out/CNAME"; exit 1; }
          echo "CNAME = $(cat out/CNAME)"

      # Chặn tình huống chính sách bị nới lỏng hoặc băm không khớp script thật -
      # trình duyệt sẽ chặn script và trang trắng, trong khi build vẫn báo thành công.
      - name: Kiểm chứng Content-Security-Policy
        run: npm run kiem-tra-csp

      # Trợ năng hỏng rất âm thầm: build vẫn xanh, test vẫn qua, trang vẫn hiển
      # thị bình thường với người sáng mắt. Dự án từng phải sửa 117 vi phạm
      # tương phản màu, và lần thử tối ưu bằng content-visibility đã loại bốn
      # tiêu đề mục khỏi cây trợ năng mà không bước CI nào phản ứng.
      - name: Cài Chromium cho kiểm tra trợ năng
        run: npx playwright install --with-deps chromium

      - name: Kiểm tra trợ năng WCAG 2.1 AA
        run: npm run kiem-tra-tro-nang

      # Rà lỗ hổng đã biết của phụ thuộc npm. Dùng --audit-level=high để bản vá
      # mức thấp không chặn triển khai, nhưng Dependabot vẫn mở PR cho chúng.
      - name: Rà lỗ hổng phụ thuộc npm
        run: npm audit --audit-level=high

  kiem-tra-ma-qr:
    name: Đối chiếu mã QR với route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài phụ thuộc Python
        run: pip install -r scripts/requirements-dev.txt

      # Pillow là thư viện xử lý ảnh, nhóm có lịch sử lỗ hổng đáng kể - cần rà
      # cùng với các phụ thuộc Python khác của pipeline dữ liệu.
      - name: Rà lỗ hổng phụ thuộc Python
        run: |
          pip install pip-audit
          pip-audit -r scripts/requirements.txt -r scripts/requirements-dev.txt

      # Chặn tình huống nguy hiểm nhất: mã QR đã in nhưng trỏ tới trang không tồn tại.
      - name: Giải mã ngược toàn bộ mã QR và đối chiếu URL
        run: python scripts/kiem-tra-ma-qr.py

      # Bộ chữ đã cắt xuống đúng phần latin và tiếng Việt. Nếu lần cập nhật Excel
      # sau đưa vào ký tự nằm ngoài phần đã cắt, trình duyệt lặng lẽ rơi về chữ
      # hệ thống cho riêng ký tự đó - trang vẫn hiện, build vẫn xanh.
      - name: Đối chiếu bộ chữ với ký tự trong dữ liệu
        run: python scripts/kiem-tra-bo-chu.py

      # File Excel thật của đơn vị không nằm trong Git, nên bước trích xuất -
      # phần đơn vị dùng thường xuyên nhất - vốn không có gì kiểm thử. Dựng lại
      # Excel từ dữ liệu đang có rồi chạy khứ hồi để chặn hồi quy.
      - name: Chạy khứ hồi pipeline trích xuất dữ liệu
        run: python scripts/kiem-tra-pipeline.py
